    <style>
      /* 冷启动首屏：不依赖 JS bundle，避免 ready-to-show 后黑屏空窗 */
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--background, #0c1220);
        color: var(--foreground, #e8eef8);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }

      html {
        color-scheme: dark;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--background, #0c1220);
        transition: opacity 0.22s ease;
      }

      #boot-splash.boot-splash-hide {
        opacity: 0;
        pointer-events: none;
      }

      #boot-splash .boot-logo {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }

      #boot-splash .boot-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      #boot-splash .boot-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 12px;
        color: var(--muted-foreground, rgba(232, 238, 248, 0.55));
        font-size: 18px;
      }

      #boot-splash .boot-spinner {
        width: 32px;
        height: 32px;
        background: var(--primary, rgba(180, 255, 80, 0.9));
        animation: smooth-morph 3s ease-in-out infinite;
      }

      @keyframes smooth-morph {
        0% {
          transform: scale(1) rotate(0deg);
          border-radius: 50%;
        }
        20% {
          transform: scale(0.9) rotate(72deg);
          border-radius: 35%;
        }
        40% {
          transform: scale(1.1) rotate(144deg);
          border-radius: 15%;
        }
        60% {
          transform: scale(0.85) rotate(216deg);
          border-radius: 8%;
        }
        80% {
          transform: scale(1.05) rotate(288deg);
          border-radius: 25%;
        }
        100% {
          transform: scale(1) rotate(360deg);
          border-radius: 50%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-spinner {
          animation: none;
        }
      }

      #root {
        height: 100%;
      }
    </style>
